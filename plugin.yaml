name: hermes-mobile-qr
version: "0.0.7"
description: |
  Hermes Mobile QR + Voice plugin. Generates a QR code for the Hermes Mobile
  App to connect directly to the Hermes Agent Desktop gateway (port 8642),
  and exposes STT/TTS/attachment routes on the gateway so the mobile app can
  speak, listen, and send files without an extra service.

  Audio routes (POST /api/audio/transcribe, /speak, /upload;
  GET /api/audio/health, /api/audio/download/{sid}/{name}) are mounted on the
  api_server platform via the standard register(ctx) handler mechanism. They
  reuse hermes-agent's existing Whisper STT and TTS provider chain — no new
  providers are bundled.

author: Sachin Taware
license: MIT
homepage: https://github.com/tawaresachin/hermes-mobile-plugin
hermes_min_version: "0.0.46"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-mobile-plugin"
version = "0.0.8"
description = "Hermes Mobile QR Plugin - Generates QR code for direct 8642 connection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sachin Taware"}]
dependencies = [
    "pyyaml>=6.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]

[project.scripts]
hermes-mobile-plugin = "hermes_mobile_plugin.cli:main"
hermes-mobile-install = "hermes_mobile_plugin.cli:install_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
name: Auto-tag release

# plugin.yaml is the single source of the version string. When a push to
# main changes it to a version with no tag yet, this workflow tags it,
# builds the wheel + sdist, attaches them to the GitHub Release and then
# kicks PyPI. Same-version content changes are inert.
#
# Why one workflow does all of it: tags pushed with GITHUB_TOKEN do NOT
# start other workflows, so a separate tag-triggered release job can never
# run (this is how every release from 0.0.19-0.0.30 ended up with a tag
# but no artifacts). Events triggered by GITHUB_TOKEN are exempt only for
# workflow_dispatch/repository_dispatch, so PyPI is kicked that way.
on:
  push:
    branches: [main]
    paths: ['plugin.yaml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: tag + build + release when plugin.yaml's version is untagged
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
      created: ${{ steps.prep.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: prep
        run: |
          VER="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' plugin.yaml | head -1)"
          test -n "$VER" || { echo "::error::no version in plugin.yaml"; exit 1; }
          TAG="v$VER"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists — nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract release notes from CHANGES.md
        if: steps.prep.outputs.created == 'true'
        run: |
          VER="${{ steps.prep.outputs.tag }}"
          VER="${VER#v}"
          # Trailing ( |$) so 0.0.1 cannot prefix-match 0.0.12's heading
          awk -v ver="$VER" '
            $0 ~ "^## " ver "( |$)" {f=1; next}
            f && /^## / {exit}
            f {print}
          ' CHANGES.md > release-notes.md
          test -s release-notes.md || echo "Release $VER" > release-notes.md
      - name: Create tag
        if: steps.prep.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.prep.outputs.tag }}" -m "${{ steps.prep.outputs.tag }} (versioned by plugin.yaml)"
          git push origin "${{ steps.prep.outputs.tag }}"
      - name: Build wheel + sdist
        if: steps.prep.outputs.created == 'true'
        run: |
          python -m pip install -U build
          python -m build
      - name: Verify the wheel's bundled manifest matches the tag
        if: steps.prep.outputs.created == 'true'
        env:
          TAG_NAME: ${{ steps.prep.outputs.tag }}
        run: |
          python - <<'PY'
          import glob, os, re, zipfile

          tag = os.environ["TAG_NAME"].lstrip("v")
          wheel = glob.glob("dist/*.whl")[0]
          manifest = zipfile.ZipFile(wheel).read("hermes_mobile_plugin/plugin.yaml").decode()
          m = re.search(r'^version:\s*"?([^"\s]+)"?', manifest, re.M)
          assert m and m.group(1) == tag, f"wheel manifest says {m and m.group(1)}, tag says {tag}"
          print(f"OK: {wheel} carries version {tag}")
          PY
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # Draft -> upload -> publish, so the artifacts exist BEFORE the
      # release is published: immutable-release settings reject uploads to
      # an already-published release, and a tag used by an immutable
      # release can never be reused.
      - name: Create the Release, attach artifacts, publish
        if: steps.prep.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          gh release create "$TAG" --draft --title "$TAG" \
            --notes-file release-notes.md --verify-tag
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets --jq '[.assets[].name]'
      - name: Trigger PyPI publish
        # GITHUB_TOKEN-created release events do not start workflows, but
        # workflow_dispatch events do. pypi.yml publishes from the tag ref.
        if: steps.prep.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pypi.yml --ref "${{ steps.prep.outputs.tag }}"
      - name: Sync README install pin to the new tag
        # The README documents install with a pinned @vX.Y.Z ref; without
        # this step it silently drifts one release behind on every tag.
        # Push it back to main so the docs always point at the newest
        # tag. (readme_pin is stdlib-only; no pip install needed here.)
        if: steps.prep.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.prep.outputs.tag }}"
          PYTHONPATH=src python3 -m hermes_mobile_plugin.readme_pin "$VER"
          if git diff --quiet -- README.md; then
            echo "README pin already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs(readme): sync install pin to ${VER}"
            git push origin main
            echo "README install pin synced to ${VER}"
          fi
